.catalog:
 name: "Rancher Active Proxy"
 version: "v1.0.0"
 questions:    
    - variable: PATH
      label: "Path to save config on host"
      default: "/data/rancher-active-proxy"
      type: string
    - variable: DEFAULT_HOST
      label: "Default Virtual Host to use"
      type: string
    - variable: DEFAULT_EMAIL
      label: "Default Email to use for Letsencrypt (must be a real address)"
      required: true
      type: string
    - variable: DEFAULT_PORT
      label: "Default Port to use"
      default: "80"
      type: string
    - variable: CRON
      label: "Auto renew cron like setup"
      default: "0 2 * * *"
      type: string
    - variable: RATE_LIMIT
      label: "Requests per second allowed per client IP (off to disable)"
      default: "30r/s"
      type: string
    - variable: WAF
      label: "Web application firewall (ModSecurity + OWASP CRS): on, detect (log only) or off"
      default: "detect"
      type: enum
      options:
        - detect
        - "on"
        - "off"
    - variable: DEBUG
      label: "Set to true to enable debug"
      default: "False"
      type: string