# Rancher v1 stack definition (compose v2 format as consumed by rancher-compose).
version: '2'
services:
  Proxy:
    image: fflo/rancher-active-proxy:latest
    environment:
      DEFAULT_HOST: "Default Domain ex: bar.com"
      DEFAULT_EMAIL: "Default Email ex: foo@bar.com"
      # CRON: "0 2 * * *"
      # TZ: Europe/Berlin
      # Flood protection / WAF defaults (override per service with rap.* labels)
      # RATE_LIMIT: 30r/s
      # RATE_BURST: "60"
      # CONN_LIMIT: "100"
      # WAF: detect            # on | detect | off
      # WAF_PARANOIA: "1"
      # REAL_IP_FROM: ""       # e.g. "173.245.48.0/20,..." when behind Cloudflare / another proxy
    volumes:
    - /local/path/data/nginx/htpasswd:/etc/nginx/htpasswd
    - /local/path/data/nginx/vhost.d:/etc/nginx/vhost.d
    - /local/path/data/nginx/letsencrypt:/etc/letsencrypt
    ports:
    - 80:80/tcp
    - 443:443/tcp
    labels:
      io.rancher.container.pull_image: always
      io.rancher.scheduler.global: 'true'
