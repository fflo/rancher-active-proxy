# rancher-active-proxy: proxy-wide hardening (installed as /etc/nginx/conf.d/00-security.conf).
# Slow-client / slowloris style floods: give up on idle clients quickly.
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
reset_timedout_connection on;
keepalive_requests 1000;

# Oversized headers are a classic probe; keep buffers small but workable for SSO cookies.
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;

# HTTP/2 flood mitigation (Rapid Reset etc.): cap streams per connection.
http2_max_concurrent_streams 128;

# Upstream connection hygiene.
proxy_connect_timeout 10s;
